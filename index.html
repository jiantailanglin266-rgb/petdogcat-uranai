.axis .a .v{font-size:15px;font-weight:900;color:var(--orange-d);margin-top:2px}

/* 各鑑定項目カード */

.item .ihead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.item .inum{flex-shrink:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;

.item .ititle .ico{margin-right:6px}
.item .ibody{font-size:14.5px;line-height:1.95;color:var(--ink)}

/* シェアエリア */
.share{text-align:center;margin-top:28px}
.share p{font-size:13px;color:var(--ink-s);margin-bottom:14px;font-weight:700}
.share .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.share button{font-family:inherit;font-weight:800;font-size:14px;padding:12px 22px;border-radius:12px;cursor:pointer;border:none;transition:.18s}

// ① 西洋12星座
function getZodiac(birth){
  const d=new Date(birth); const m=d.getMonth()+1, day=d.getDate();
  const z=([
    ["capricorn",1,20],["aquarius",2,19],["pisces",3,20],["aries",4,19],
    ["taurus",5,20],["gemini",6,21],["cancer",7,22],["leo",8,22],
    ["virgo",9,22],["libra",10,23],["scorpio",11,22],["sagittarius",12,21],
  ]);
  // 各月の境界日以前ならその月の星座、超えたら翌月の星座
  let key;
  for(let i=0;i<z.length;i++){ if(m===z[i][1]){ key = day<=z[i][2]?z[i][0]:z[(i+1)%12][0]; break; } }
  return {key, ...ZODIAC[key]};
}

// ② 数秘術の運命数（各桁合算→1桁、ただし11/22/33は保持）
function getLifePathNumber(birth){
  const digits=birth.replace(/\D/g,""); // yyyymmdd
  const reduce=(n)=>{ while(n>9 && n!==11 && n!==22 && n!==33){ n=String(n).split("").reduce((a,b)=>a+ +b,0); } return n; };
  const sum=digits.split("").reduce((a,b)=>a+ +b,0);
  const num=reduce(sum);
  return {num, ...LIFEPATH[num]};
}

  const map = species==="cat"?CAT_BREED_MAP:DOG_BREED_MAP;

  const groupKey = map[breed] || "その他";
  return {key:groupKey, ...groups[groupKey]};
}

// ④ 簡易・画数／音の響き判定（カタカナ・ひらがな対応）
function getNameStrokes(name){
  if(!name) return {vowel:VOWEL.a, number:1, numberText:NAME_NUMBER[1], reduced:1};
  // 主要母音の判定（清音・濁音をざっくり母音に対応づけ）
  const vmap={a:"あかさたなはまやらわがざだばぱアカサタナハマヤラワガザダバパ",
              i:"いきしちにひみりぎじぢびぴイキシチニヒミリギジヂビピ",
              u:"うくすつぬふむゆるぐずづぶぷウクスツヌフムユルグズヅブプ",
              e:"えけせてねへめれげぜでべぺエケセテネヘメレゲゼデベペ",
              o:"おこそとのほもよろをごぞどぼぽオコソトノホモヨロヲゴゾドボポ"};
  const cnt={a:0,i:0,u:0,e:0,o:0};
  for(const ch of name){ for(const v in vmap){ if(vmap[v].includes(ch)) cnt[v]++; } }
  let topV="a",max=-1; for(const v in cnt){ if(cnt[v]>max){max=cnt[v];topV=v;} }
  // 名前の「数」＝文字コード総和を1〜9へ（厳密な画数ではなく簡易ロジック）
  let sum=0; for(const ch of name){ sum+=ch.codePointAt(0); }
  let reduced=(sum%9)+1; // 1〜9
  return {vowel:VOWEL[topV], number:reduced, numberText:NAME_NUMBER[reduced], reduced};
}

// 共通：名前の表記ゆれ用ヘルパー
function petName(p){ return escapeHtml(p.input.name); }
function speciesWord(p){ return p.input.species==="cat"?"猫":"犬"; }

// ① 性格診断（犬種グループ＋星座＋数秘を掛け合わせ＝占いの顔・最も厚く）
function item01_personality(p){
  const n=petName(p);
  let html="";
  html+=`<p>${n}ちゃんは、行動学から見ると<b>${p.breed.label}</b>。${p.breed.personality}。</p>`;
  html+=`<p>そこに生まれ持った<b>${p.zodiac.name}${p.zodiac.emoji}</b>の星が重なります。${p.zodiac.trait}。${speciesWord(p)}としての気質と星の性質が溶け合い、${n}ちゃんならではの表情をつくり出しています。</p>`;
  html+=`<p>さらに魂の中心には、数秘術の運命数<b>「${p.lifepath.num}・${p.lifepath.key}」</b>が息づいています。${p.lifepath.core}。これが、${n}ちゃんの「らしさ」の核となる部分です。</p>`;
  // 短所も愛おしく（ネガティブ断定で終わらせない）
  html+=`<p>ときに頑固に見えたり、気分屋に映る瞬間があるかもしれません。けれどそれは、${n}ちゃんが自分の心に正直で、まっすぐに生きている証。短所のように見えるところまで含めて、まるごと愛おしい——それがこの子の魅力です。</p>`;
  // 経歴補正（保護・繁殖などのトーン）
  if(p.history.tone){ html+=`<div class="quote">${p.history.tone}</div>`; }
  return {title:"性格診断", ico:"🌟", html, feature:true};
}

// ② 飼い主との相性（数秘＋星座ベース）
function item02_owner(p){
  const n=petName(p);
  let html="";
  html+=`<p>${n}ちゃんと、あなた。この出会いには意味があります。</p>`;
  html+=`<p>数秘の上で${n}ちゃんは<b>${p.lifepath.role}</b>。あなたにとって、${p.lifepath.love}存在になってくれるでしょう。</p>`;
  html+=`<p>恋愛でいう相性にたとえるなら、${n}ちゃんは<b>${p.zodiac.love}</b>。${p.zodiac.element}のエネルギーを持つこの子は、あなたの毎日にちょうどよい温度を運んでくれます。</p>`;
  html+=`<p>ときには気持ちがすれ違う日もあるかもしれません。でも大丈夫。${n}ちゃんはいつも、あなたのことを見ています。焦らずゆっくり、お互いのペースで絆を深めていけば、唯一無二のパートナーになれる二人です。</p>`;
  return {title:"飼い主との相性", ico:"💞", html};
}

// ③ 過去の名前から見える過去の運命（過去の名前があればそれで、なければ現在の名前で）
function item03_pastFate(p){
  const n=petName(p);
  const useName = p.pastName ? p.pastName : p.name;
  const label = p.pastName ? `かつての名前「${escapeHtml(p.input.pastName)}」` : `今のお名前「${n}」`;
  let html="";
  if(p.pastName){
    html+=`<p>${n}ちゃんには、今の名前になる前の物語があります。</p>`;
  }else{
    html+=`<p>名前には、その子が歩んできた運命が映し出されると言われます。</p>`;
  }
  html+=`<p>${label}が響かせる音は、<b>${useName.vowel.key}</b>。${useName.vowel.reading}を持っています。</p>`;
  html+=`<p>その名が宿す数は<b>「${useName.number}」</b>。${useName.numberText}。</p>`;
  if(p.pastName){
    html+=`<p>過去にどんな日々があったとしても、その響きと数は、${n}ちゃんが本来持っている力をずっと示し続けてきました。過去はこの子の土台。そのすべてが、今のあなたとの暮らしへつながっています。</p>`;
  }else{
    html+=`<p>この名前を選んだのは、きっと偶然ではありません。${n}ちゃんが持って生まれた運命と、あなたがつけた名前は、不思議なほど響き合っています。</p>`;
  }
  return {title:"過去の名前から見える運命", ico:"📜", html};
}

// ④ 今世での役割（数秘の運命数ベース＋経歴補正）
function item04_role(p){
  const n=petName(p);
  let html="";
  html+=`<p>${n}ちゃんがこの世に生まれ、あなたと出会ったことには、ちゃんと役割があります。</p>`;
  html+=`<p>運命数<b>「${p.lifepath.num}・${p.lifepath.key}」</b>を持つ${n}ちゃんの使命は——<b>${p.lifepath.role}</b>であること。${p.lifepath.core}。その存在そのものが、あなたの人生へのギフトです。</p>`;
  // 経歴によって役割の意味づけを補正
  if(p.history.flag==="rescue"){
    html+=`<p>一度は人と離れる経験をしたこの子だからこそ、「もう一度信じること」の尊さを、あなたに教えてくれます。${n}ちゃんがあなたを選び直したこと——それ自体が、深い意味を持つ役割なのです。</p>`;
  }else if(p.history.flag==="breeding"){
    html+=`<p>たくさんの命に寄り添ってきた${n}ちゃんは、いま「自分が愛される番」を生きています。あなたに愛される姿を見せることが、この子の新しい、そして何より大切な役割です。</p>`;
  }else{
    html+=`<p>気負う必要はありません。${n}ちゃんはただ、そこにいてくれるだけでいい。その役割を、毎日しっかり果たしてくれています。</p>`;
  }
  return {title:"今世での役割", ico:"✨", html};
}

// ⑤ 得意なこと（犬種/猫種グループ＋星座ベース）
function item05_talent(p){
  const n=petName(p);
  let html="";
  html+=`<p>${n}ちゃんには、生まれ持った得意分野があります。</p>`;
  html+=`<p>${p.breed.label}ゆずりの才能は——<b>${p.breed.talent}</b>。これはこの子が自然体でいるときに、いちばん輝くポイントです。</p>`;
  html+=`<p>さらに${p.zodiac.name}${p.zodiac.emoji}の星が、<b>${p.zodiac.talent}</b>という魅力を添えています。ふたつが組み合わさることで、${n}ちゃんだけの特別な「得意」が生まれます。</p>`;
  html+=`<p>もし伸ばしてあげたいなら、${n}ちゃんが夢中になっている瞬間をそっと応援してあげてください。「上手だね」のひと言が、この子の才能をぐんと花開かせます。</p>`;
  return {title:"得意なこと", ico:"🎯", html};
}

// 表示する項目の登録順（後続回はここに push するだけ）
const ITEMS = [
  item01_personality,
  item02_owner,
  item03_pastFate,
  item04_role,
  item05_talent,
];

/* ───────────────────────────────────────────
   5. 描画・UI制御
─────────────────────────────────────────── */

// HTMLエスケープ（入力値の安全な表示用）
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 犬種/猫種セレクトを種別に応じて切り替え
function renderBreedOptions(species){
  const sel=document.getElementById("breed");
  const label=document.getElementById("breedLabel");
  const map = species==="cat"?CAT_BREED_MAP:DOG_BREED_MAP;
  label.firstChild.textContent = species==="cat"?"猫種":"犬種";
  let html=`<option value="">選択してください</option>`;
  for(const k in map){ html+=`<option>${k}</option>`; }
  sel.innerHTML=html;
}

// 結果の描画
function renderResult(p){
  const r=document.getElementById("result");
  const n=petName(p);
  const emoji = p.input.species==="cat" ? "🐱" : "🐶";
  const colorAxis = p.color ? `<div class="a"><div class="k">カラー診断</div><div class="v">${escapeHtml(p.color.key)}</div></div>` : "";

  let html="";
  // プロフィール要約（スクショ・シェア映えするヘッダー）
  html+=`<div class="card profile">
    <div class="pet-emoji">${emoji}✦</div>
    <h2 class="serif">${n} ちゃんの鑑定書</h2>
    <p class="pet-meta">${escapeHtml(p.input.gender)}・${p.breed.label}${p.input.color?"・"+escapeHtml(p.input.color):""}</p>
    <div class="axis">
      <div class="a"><div class="k">星座</div><div class="v">${p.zodiac.name}${p.zodiac.emoji}</div></div>
      <div class="a"><div class="k">運命数</div><div class="v">${p.lifepath.num}</div></div>
      <div class="a"><div class="k">タイプ</div><div class="v">${p.lifepath.key}</div></div>
      ${colorAxis}
    </div>
  </div>`;

  // 各項目（ITEMS配列を順に実行）
  ITEMS.forEach((fn,i)=>{
    const it=fn(p);
    html+=`<div class="card item${it.feature?' feature':''}">
      <div class="ihead">
        <div class="inum">${i+1}</div>
        <div class="ititle"><span class="ico">${it.ico}</span>${escapeHtml(it.title)}${it.feature?'<span class="badge">占いの顔</span>':''}</div>
      </div>
      <div class="ibody">${it.html}</div>
    </div>`;
  });

  // 後続回予告（拡張の布石）
  html+=`<div class="coming">
    <div class="t">🔮 この続きは、近日公開予定</div>
    <div class="d">前世・幸福度メーター・幸せの瞬間ベスト5・${n}ちゃんからあなたへの手紙 …など全20項目以上をお届けします。</div>
  </div>`;

  // シェアエリア
  html+=`<div class="share">
    <p>📸 結果をスクショして、SNSでシェアしてね</p>
    <div class="btns">
      <button type="button" class="b-share" id="shareBtn">結果をシェア</button>
      <button type="button" class="b-again" id="againBtn">もう一度占う</button>
    </div>
  </div>`;

  r.innerHTML=html;
  r.classList.add("show");

  // シェアボタン（Web Share API、なければURLコピー）
  document.getElementById("shareBtn").addEventListener("click",()=>{
    const text=`${n}ちゃんを本格ペット占いで鑑定したよ🔮 星座は${p.zodiac.name}、運命数は${p.lifepath.num}「${p.lifepath.key}」でした✦`;
    const url="https://petdogcat.jp/uranai/";
    if(navigator.share){ navigator.share({title:"ペット占い",text,url}).catch(()=>{}); }
    else{ navigator.clipboard?.writeText(text+" "+url); alert("シェア用テキストをコピーしました！"); }
  });
  // もう一度占う
  document.getElementById("againBtn").addEventListener("click",()=>{
    r.classList.remove("show"); r.innerHTML="";
    document.getElementById("formCard").scrollIntoView({behavior:"smooth"});
  });

  // 結果へスクロール
  r.scrollIntoView({behavior:"smooth",block:"start"});
}

// フォーム送信
function onSubmit(e){
  e.preventDefault();
  const err=document.getElementById("err"); err.textContent="";
  const f=e.target;
  const input={
    species: f.species.value,
    name: f.name.value.trim(),
    gender: f.gender.value,
    breed: f.breed.value,
    color: f.color.value,
    birth: f.birth.value,
    birthTime: f.birthTime.value,
    birthPlace: f.birthPlace.value,
    pastName: f.pastName.value.trim(),
    history: f.history.value,
  };
  // 必須チェック
  if(!input.name){ err.textContent="お名前を入力してください🐾"; return; }
  if(!input.birth){ err.textContent="生年月日を入力してください🐾"; return; }

  const profile=buildProfile(input);
  renderResult(profile);
}

/* ───────────────────────────────────────────
   6. 初期化
─────────────────────────────────────────── */
(function init(){
  // 背景の星をランダム配置（装飾）
  const stars=document.getElementById("stars");
  const glyphs=["✦","✧","⋆","✶","·"];
  let sh="";
  for(let i=0;i<40;i++){
    const x=Math.random()*100, y=Math.random()*100;
    const s=8+Math.random()*16, d=Math.random()*4;
    sh+=`<span style="left:${x}%;top:${y}%;font-size:${s}px;animation-delay:${d}s">${glyphs[i%glyphs.length]}</span>`;
  }
  stars.innerHTML=sh;

  // 種別切り替えで犬種/猫種セレクトを更新
  renderBreedOptions("dog");
  document.querySelectorAll('input[name="species"]').forEach(r=>{
    r.addEventListener("change",e=>renderBreedOptions(e.target.value));
  });

  document.getElementById("petForm").addEventListener("submit",onSubmit);
})();
</script>
